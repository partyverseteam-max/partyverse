<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PartyVerse Favicon">
  <defs>
    <linearGradient id="fav-grad" gradientUnits="userSpaceOnUse" x1="8" y1="8" x2="56" y2="56">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="52%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="fav-core" gradientUnits="userSpaceOnUse" x1="21" y1="21" x2="43" y2="43">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
