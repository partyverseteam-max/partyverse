    stroke-linejoin="round"
  />
  <path
    d="M 49.25 22.00 L 53.48 29.35 A 5.25 5.25 0 0 1 53.45 34.63 L 44.52 49.79 A 5.25 5.25 0 0 1 40.00 52.38 L 25.25 52.38"
    fill="none"
    stroke="url(#fav-grad)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Connection Nodes -->
  <circle cx="46" cy="15.25" r="3.4" fill="#22D3EE"/>
  <circle cx="18" cy="48.75" r="3.4" fill="#8B5CF6"/>

  <!-- Bold Central Spark -->
