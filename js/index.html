<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PartyVerse — Phase 0 Setup Check</title>
  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
    async
    defer
  ></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f111a;
      color: #f1f5f9;
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #181c2b;
      border: 1px solid #2b324d;
      border-radius: 16px;
      padding: 1.5rem;
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.4rem; }
    p.sub { margin: 0 0 1.25rem; color: #94a3b8; font-size: 0.9rem; }
    .status-list {
      list-style: none;
      padding: 0;
      margin: 0 0 1.25rem;
      display: grid;
      gap: 0.6rem;
    }
    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111420;
      padding: 0.65rem 0.85rem;
      border-radius: 10px;
      font-size: 0.9rem;
    }
    .badge {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: #334155;
      color: #e2e8f0;
    }
    .badge.ok { background: #14532d; color: #86efac; }
    .badge.err { background: #7f1d1d; color: #fca5a5; }
    .badge.warn { background: #78350f; color: #fde68a; }
    #turnstile-box {
      display: flex;
      justify-content: center;
      margin-bottom: 1rem;
      min-height: 65px;
    }
    .actions {
      display: grid;
      gap: 0.6rem;
    }
    button {
      width: 100%;
      padding: 0.8rem 1rem;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary { background: #6366f1; color: #ffffff; }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: #262c45; color: #e2e8f0; }
    pre {
      margin: 1rem 0 0;
      padding: 0.75rem;
      background: #0b0d14;
      border-radius: 10px;
      font-size: 0.8rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>PartyVerse</h1>
    <p class="sub">Phase 0 — Connection, Auth &amp; Turnstile Diagnostic</p>

    <ul class="status-list">
      <li class="status-item">
        <span>Config Keys</span>
        <span id="status-config" class="badge">Checking...</span>
      </li>
      <li class="status-item">
        <span>Supabase Client</span>
        <span id="status-client" class="badge">Checking...</span>
      </li>
      <li class="status-item">
        <span>Turnstile CAPTCHA</span>
        <span id="status-turnstile" class="badge">Waiting...</span>
      </li>
      <li class="status-item">
        <span>Anonymous Session</span>
        <span id="status-auth" class="badge">Not signed in</span>
      </li>
    </ul>

    <div id="turnstile-box"></div>

    <div class="actions">
      <button id="btn-signin" class="primary" disabled>
        Test Anonymous Sign-In
      </button>
      <button id="btn-signout" class="secondary" hidden>
        Sign Out (Reset Test)
      </button>
    </div>

    <pre id="log-output">Waiting for checks...</pre>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
